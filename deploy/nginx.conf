# ==========================================
# Rise Platform — Production Nginx Reverse Proxy
# Reverse Proxy, Security Headers & Dynamic Hostnames
# ==========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstreams
    upstream rise_api {
        server api:3000;
        keepalive 32;
    }

    upstream rise_admin {
        server admin:4173;
        keepalive 32;
    }

    # Default Server (IP & sslip.io hostnames)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _ 64.177.41.52 64-177-41-52.sslip.io *.sslip.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Route /api/ to Fastify REST API
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://rise_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # Route root to Admin Studio
        location / {
            proxy_pass http://rise_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
