# ==========================================
# Rise Platform — Production Nginx Reverse Proxy
# SSL Termination, Security Headers & Reverse Proxy
# ==========================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstreams
    upstream rise_api {
        server api:3000;
        keepalive 32;
    }

    upstream rise_admin {
        server admin:4173;
        keepalive 32;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name api.riseapp.com admin.riseapp.com riseapp.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API Subdomain (api.riseapp.com)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.riseapp.com;

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/api.riseapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.riseapp.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://rise_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # Admin Studio Subdomain (admin.riseapp.com)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.riseapp.com;

        ssl_certificate /etc/letsencrypt/live/admin.riseapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.riseapp.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://rise_admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
